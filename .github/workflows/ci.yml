name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: shelter
          POSTGRES_PASSWORD: shelter
          POSTGRES_DB: shelter_sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelter -d shelter_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      # Тестові значення лише для CI. Робочі секрети тут не використовуються.
      APP_ENV: sandbox
      DATABASE_URL: postgresql+asyncpg://shelter:shelter@localhost:5432/shelter_sandbox
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Tests (pytest)
        working-directory: backend
        run: pytest -q
