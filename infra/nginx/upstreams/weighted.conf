# Weighted Round Robin: потужніша репліка отримує більше запитів (3 : 2 : 1)
upstream backend_pool {
    server backend:8000  weight=3 max_fails=2 fail_timeout=10s;
    server backend2:8000 weight=2 max_fails=2 fail_timeout=10s;
    server backend3:8000 weight=1 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
