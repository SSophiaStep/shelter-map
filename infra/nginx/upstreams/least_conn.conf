# Least Connections: запит іде на репліку з найменшою кількістю активних з'єднань
upstream backend_pool {
    least_conn;
    server backend:8000  max_fails=2 fail_timeout=10s;
    server backend2:8000 max_fails=2 fail_timeout=10s;
    server backend3:8000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
