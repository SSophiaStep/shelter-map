worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # У лозі видно, яка репліка обробила запит (upstream і X-Served-By)
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr served_by=$upstream_http_x_served_by '
                  'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    # Група серверів `backend_pool` і алгоритм балансування (див. upstreams/)
    include /etc/nginx/conf.d/upstream.conf;

    server {
        listen 80;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Пасивна перевірка: якщо репліка не відповідає, запит одразу
            # йде на наступну, а репліка тимчасово виключається (max_fails).
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
