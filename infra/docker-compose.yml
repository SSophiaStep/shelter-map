# Уся система однією командою (з папки infra):
#   docker compose up --build                   - застосунок + PostgreSQL + Redis
#   docker compose --profile lb up --build      - + 3 репліки та Nginx-балансувальник
# Змінні читаються з infra/.env (див. .env.example). Для іншого середовища:
#   docker compose --env-file .env.production -p shelter-production up --build

name: shelter-map

x-backend: &backend
  build:
    context: ../backend
  image: shelter-map-backend:latest
  restart: unless-stopped
  networks: [internal, edge]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  environment: &backend-env
    APP_ENV: ${APP_ENV:-sandbox}
    DEBUG: ${DEBUG:-false}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    CACHE_ENABLED: ${CACHE_ENABLED:-false}
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/live', timeout=2)"
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовий сервіс: застосовує міграції до запуску застосунку
  migrate:
    build:
      context: ../backend
    image: shelter-map-backend:latest
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    environment: *backend-env

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      INSTANCE_ID: backend1
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  backend2:
    <<: *backend
    profiles: [lb]
    environment:
      <<: *backend-env
      INSTANCE_ID: backend2

  backend3:
    <<: *backend
    profiles: [lb]
    environment:
      <<: *backend-env
      INSTANCE_ID: backend3

  nginx:
    image: nginx:1.27-alpine
    profiles: [lb]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstreams/${LB_ALGO:-round_robin}.conf:/etc/nginx/conf.d/upstream.conf:ro
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [internal]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks: [internal, edge]
    depends_on: [prometheus]

networks:
  # internal: БД, Redis і застосунок. edge: Nginx і застосунок. Nginx до БД доступу не має.
  internal:
  edge:

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
