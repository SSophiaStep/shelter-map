# Режим розробки з hot-reload (з папки infra):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Код із папки backend/app монтується в контейнер, зміни підхоплюються без перезбірки образу.
services:
  backend:
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    environment:
      APP_ENV: sandbox
      DEBUG: "true"
      # Docker Desktop (Windows/macOS) не завжди передає події файлової системи
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend/app:/app/app
